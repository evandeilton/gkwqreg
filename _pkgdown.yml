# gkwqreg — pkgdown: tema claro esverdeado, fonte Ubuntu (mesma família do gkwreg)

url: https://evandeilton.github.io/gkwqreg/

# docs/ guarda os ADRs do projeto; o site vai para um destino proprio.
destination: pkgdown-site

template:
  bootstrap: 5
  bootswatch: litera
  math-rendering: katex
  bslib:
    base_font: {google: "Ubuntu"}
    heading_font: {google: "Ubuntu"}
    code_font: {google: "Ubuntu Mono"}
    primary: "#2F6B4F"
    secondary: "#5C8A74"
    success: "#2F6B4F"
    link-color: "#256048"
    link-hover-color: "#16382A"
    code-color: "#1F5F45"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/evandeilton/gkwqreg
      aria-label: GitHub
  bg: light
  type: light

footer:
  structure:
    left: developed_by
    right: built_with

articles:
- title: Articles
  navbar: ~
  contents:
  - "gkwqreg-anchor"
  - "gkwqreg-case-study"
  - "gkwqreg-comparison"
  - "gkwqreg-design"

reference:
- title: Fitting the model
  desc: >
    The entry point, and the pieces that configure a fit.
  contents:
  - gkwqreg
  - gkwq_control
  - gkwq_parts
  - gkwq_anchors
  - gkwq_quantile

- title: Extractors and summaries
  desc: >
    The standard S3 surface, for a single fit and for a set of fits over
    several quantile levels.
  contents:
  - coef.gkwqreg
  - coef.gkwqregs
  - fitted.gkwqreg

- title: Prediction and marginal effects
  contents:
  - predict.gkwqreg
  - marginal_effects

- title: Inference
  desc: >
    Wald, likelihood-ratio, profile, bootstrap and sandwich routes, plus the
    tests for comparing fits.
  contents:
  - vcov.gkwqreg
  - confint.gkwqreg
  - anova.gkwqreg
  - lrtest
  - vuong_test
  - compare_families
  - gkwq_boot
  - estfun.gkwqreg
  - bread.gkwqreg

- title: Residuals and diagnostics
  contents:
  - residuals.gkwqreg
  - pinball

- title: The quantile process
  desc: >
    Fitting over a grid of quantile levels, detecting crossing and repairing it.
  contents:
  - quantile_process
  - check_crossing
  - rearrange

- title: Plots
  contents:
  - plot.gkwqreg
  - plot.gkwq_process

- title: Simulation
  contents:
  - simulate.gkwqreg
