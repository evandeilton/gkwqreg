# gkwqreg — pkgdown: corpo claro, navbar escura, paleta tirada do logo.
#
# As cores nao sao escolhidas de novo aqui: sao os proprios stops do gradiente
# do hexagono (man/figures/logo.png). Violeta #4c1d95 -> roxo #7e22ce ->
# fucsia #a21caf sao o inicio, o meio e o terco da densidade; #544b85 e a
# cauda 1-tau apagada; #fbbf24 e a borda do hexagono e o pino em Q(tau).
#
# O ambar so aparece sobre a navbar escura. Em fundo claro ele da 1.67:1, o
# que reprova ate para componente de UI (3:1); sobre #0c0a1d da 11.7:1.

url: https://evandeilton.github.io/gkwqreg/

# docs/ guarda os ADRs do projeto; o site vai para um destino proprio.
destination: pkgdown-site

template:
  bootstrap: 5
  bootswatch: litera
  math-rendering: katex
  bslib:
    base_font: {google: "Ubuntu"}
    heading_font: {google: "Ubuntu"}
    code_font: {google: "Ubuntu Mono"}
    primary: "#7e22ce"          # 2o stop do gradiente   — 7.0:1 no branco
    secondary: "#544b85"        # a cauda 1-tau apagada  — 7.7:1
    success: "#4c1d95"          # 1o stop do gradiente   — 11.0:1
    link-color: "#7e22ce"
    link-hover-color: "#4c1d95"
    code-color: "#a21caf"       # 3o stop do gradiente   — 6.3:1

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/evandeilton/gkwqreg
      aria-label: GitHub
  bg: dark
  type: dark

footer:
  structure:
    left: developed_by
    right: built_with

articles:
- title: Articles
  navbar: ~
  contents:
  - "gkwqreg-anchor"
  - "gkwqreg-case-study"
  - "gkwqreg-comparison"
  - "gkwqreg-design"

reference:
- title: Fitting the model
  desc: >
    The entry point, and the pieces that configure a fit.
  contents:
  - gkwqreg
  - gkwq_control
  - gkwq_parts
  - gkwq_anchors
  - gkwq_quantile

- title: Extractors and summaries
  desc: >
    The standard S3 surface, for a single fit and for a set of fits over
    several quantile levels.
  contents:
  - coef.gkwqreg
  - coef.gkwqregs
  - fitted.gkwqreg

- title: Prediction and marginal effects
  contents:
  - predict.gkwqreg
  - marginal_effects

- title: Inference
  desc: >
    Wald, likelihood-ratio, profile, bootstrap and sandwich routes, plus the
    tests for comparing fits.
  contents:
  - vcov.gkwqreg
  - confint.gkwqreg
  - anova.gkwqreg
  - lrtest
  - vuong_test
  - compare_families
  - gkwq_boot
  - estfun.gkwqreg
  - bread.gkwqreg

- title: Residuals and diagnostics
  contents:
  - residuals.gkwqreg
  - pinball

- title: The quantile process
  desc: >
    Fitting over a grid of quantile levels, detecting crossing and repairing it.
  contents:
  - quantile_process
  - check_crossing
  - rearrange

- title: Plots
  contents:
  - plot.gkwqreg
  - plot.gkwq_process

- title: Simulation
  contents:
  - simulate.gkwqreg
